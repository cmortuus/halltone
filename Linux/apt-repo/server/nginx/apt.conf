server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/apt;
    autoindex on;

    # LAN log receiver (halltone-logrx on 127.0.0.1:8082).
    location /halltone-logs/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # reprepro's config and database are not for clients.
    location ~ ^/halltone/(conf|db)(/|$) { deny all; }
}
