name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portable HalltoneCore (wire format, codecs, jitter buffer, ring, libopus) on Ubuntu 24.04.
  linux-core:
    name: Linux (Ubuntu 24.04) - HalltoneCore build + test
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: Packages/HalltoneCore
        run: swift build
      - name: Test
        working-directory: Packages/HalltoneCore
        run: swift test

  # Same package on macOS, including HalltoneSender / HalltoneReceiver, via the repo's test script.
  macos-core:
    name: macOS 15 - HalltoneCore tests (scripts/test-core.sh)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: scripts/test-core.sh

  # Dialog detector (vendored libfvad + center extraction + gates); no Apple frameworks. Installs
  # espeak-ng so the speech tests run instead of skipping.
  linux-dialog:
    name: Linux (Ubuntu 24.04) - HalltoneDialog build + test
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install espeak-ng (speech test fixtures are synthesized at test time)
        run: apt-get update && apt-get install -y --no-install-recommends espeak-ng
      - name: Build
        working-directory: Packages/HalltoneDialog
        run: swift build
      - name: Test
        working-directory: Packages/HalltoneDialog
        run: swift test

  # halltone-linux: the Ubuntu sender (portable SenderCore + PulseAudio capture + Avahi). Builds
  # against libpulse, runs the unit tests and the integration test (the real executable with a
  # synthetic tone source and a UDP receiver that subscribes and decodes), then a second pass
  # against a real PulseAudio server with a null sink to exercise capture and sink switching.
  linux-sender:
    name: Linux (Ubuntu 24.04) - halltone-linux build + test
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install libpulse-dev, avahi-utils, a PulseAudio server for the capture test, espeak-ng for the dialog fixtures
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libpulse-dev avahi-utils pulseaudio pulseaudio-utils espeak-ng
      - name: Build (debug)
        working-directory: Linux/halltone-linux
        run: swift build
      - name: Build (release, as install.sh does)
        working-directory: Linux/halltone-linux
        run: swift build -c release && .build/release/halltone-linux --version
      - name: Test (unit + integration with the tone source; dialog pause against a fake Mac)
        working-directory: Linux/halltone-linux
        env:
          HALLTONE_SHOW_LOG: "1"   # prints the dialog/ack log lines of the end-to-end run
        # stdbuf + timeout: if anything wedges, keep the log up to that point and fail fast.
        run: stdbuf -oL -eL timeout 420 swift test
      - name: Start PulseAudio with a null sink
        run: |
          useradd -m -s /bin/bash ci
          mkdir -p /tmp/pulse-ci && chown ci /tmp/pulse-ci
          su ci -c "XDG_RUNTIME_DIR=/tmp/pulse-ci pulseaudio -n --daemonize=yes --exit-idle-time=-1 --log-target=file:/tmp/pulse-ci/log -L 'module-null-sink sink_name=ci' -L 'module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulse-ci/native'"
          sleep 2
          PULSE_SERVER=unix:/tmp/pulse-ci/native pactl info
      - name: Test (PulseAudio capture, default-sink switching, per-application dialog analysis)
        working-directory: Linux/halltone-linux
        env:
          HALLTONE_PULSE_TEST: "1"
          PULSE_SERVER: unix:/tmp/pulse-ci/native
        run: stdbuf -oL -eL timeout 420 swift test --filter PulseTests
      - name: PulseAudio log (on failure)
        if: failure()
        run: cat /tmp/pulse-ci/log || true
